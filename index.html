<style>
  :root {
    --bg: #0b0908;
    --ink: #f3efe7;
    --ink-muted: #93897a;
    --gold: #c9a15f;
    --gold-bright: #e8cb8a;
    --border: rgba(201, 161, 95, 0.2);
    --border-soft: rgba(255, 255, 255, 0.08);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Living background: drifting embers + vignette ---------- */
  #embers {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 38%, transparent 25%, rgba(0, 0, 0, 0.6) 100%);
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 130px;
  }

  /* ---------- The seal ---------- */
  .seal {
    position: relative;
    width: 168px;
    height: 168px;
    margin: 0 auto 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(201, 161, 95, 0.2), rgba(255, 255, 255, 0.015) 70%);
    border: 1px solid var(--border);
    box-shadow:
      0 24px 48px -20px rgba(0, 0, 0, 0.75),
      inset 0 1px 1px rgba(255, 255, 255, 0.07),
      inset 0 -10px 18px -10px rgba(0, 0, 0, 0.55);
    animation: stamp 0.9s cubic-bezier(.2, 1.4, .4, 1) backwards;
    animation-delay: .1s;
  }
  @keyframes stamp {
    0%   { opacity: 0; transform: scale(1.6) rotate(-8deg); }
    60%  { opacity: 1; transform: scale(0.94) rotate(1deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .ripple {
    position: absolute;
    inset: 0;
    border: 1px solid var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: ripple 0.8s ease-out backwards;
    animation-delay: .6s;
  }
  @keyframes ripple {
    0%   { opacity: .8; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.7); }
  }

  .seal-ring {
    position: absolute;
    inset: -20px;
    width: calc(100% + 40px);
    height: calc(100% + 40px);
    overflow: visible;
  }
  .ring-line { fill: none; stroke: var(--border-soft); stroke-width: 1; }
  .ring-text {
    fill: var(--gold-bright);
    font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    font-weight: 600;
    font-size: 13px;
  }

  .seal-mark {
    font-family: 'Reem Kufi', 'Segoe UI', Tahoma, sans-serif;
    font-size: 46px;
    line-height: 1;
    padding-bottom: 6px;
    background: linear-gradient(160deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  /* To use a real photo instead of the monogram:
     1) Remove the .seal-mark span
     2) Add: <img class="seal-photo" src="your-photo.jpg" alt="عبدالرحمن لطف الحذيفي">
     .seal-photo { width: 78%; height: 78%; border-radius: 50%; object-fit: cover; } */

  /* ---------- Kinetic name reveal ---------- */
  .name {
    margin: 0;
    overflow: hidden;
  }
  .name-reveal {
    display: inline-block;
    font-family: 'Reem Kufi', 'Segoe UI', Tahoma, sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 7vw, 2.25rem);
    line-height: 1.4;
    color: var(--ink);
    animation: reveal 0.9s cubic-bezier(.65, 0, .15, 1) backwards;
    animation-delay: .85s;
  }
  @keyframes reveal {
    from { clip-path: inset(0 0 0 100%); }
    to   { clip-path: inset(0 0 0 0%); }
  }

  /* ---------- Bottom dock ---------- */
  .dock {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 8px;
    padding: 9px;
    background: rgba(15, 14, 13, 0.75);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.6);
    animation: rise .7s var(--ease) backwards;
    animation-delay: 1.35s;
  }
  @keyframes rise {
    from { opacity: 0; transform: translate(-50%, 14px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
  .dock-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    appearance: none;
    color: var(--ink);
    text-decoration: none;
    transition: transform .25s var(--ease), filter .25s ease;
  }
  .dock-btn:hover, .dock-btn:active { transform: translateY(-4px); }
  .dock-btn svg { width: 20px; height: 20px; }
  .dock-btn[data-tone="gold"]      { background: rgba(201, 161, 95, 0.16); color: var(--gold-bright); }
  .dock-btn[data-tone="whatsapp"]  { background: rgba(37, 211, 102, 0.16); color: #4ade80; }
  .dock-btn[data-tone="telegram"]  { background: rgba(79, 168, 220, 0.17); color: #6fc3f0; }
  .dock-btn[data-tone="instagram"] { background: rgba(199, 84, 138, 0.18); color: #e8a0c4; }
  .dock-btn[data-tone="facebook"]  { background: rgba(76, 110, 168, 0.18); color: #8faede; }

  /* ---------- Bottom sheets ---------- */
  .sheet {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(4, 4, 4, 0.62);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 999;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .sheet.is-open { opacity: 1; }
  .sheet-panel {
    width: 100%;
    max-width: 480px;
    background: #100f0d;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 26px 26px 0 0;
    padding: 14px 22px max(26px, env(safe-area-inset-bottom));
    text-align: center;
    box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, 0.7);
    transform: translateY(100%);
    transition: transform .32s var(--ease);
  }
  .sheet.is-open .sheet-panel { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 4px;
    margin: 0 auto 18px;
    background: var(--border-soft);
    border-radius: 2px;
  }
  .sheet-panel h2 {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 0 0 18px;
  }

  .option-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 0 0 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    color: var(--ink);
    font-family: inherit;
    font-weight: 500;
    font-size: .98rem;
    text-decoration: none;
    cursor: pointer;
    appearance: none;
    transition: background .25s ease, border-color .25s ease;
  }
  .option-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--border); }
  .option-btn:disabled,
  .option-btn:disabled:hover {
    opacity: .45;
    cursor: not-allowed;
    background: rgba(255, 255, 255, 0.04);
    border-color: var(--border-soft);
  }
  .option-note { font-size: .82em; color: var(--ink-muted); margin-inline-start: 6px; }

  .close-btn {
    display: block;
    width: 100%;
    margin: 6px 0 0;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: .92rem;
    cursor: pointer;
    appearance: none;
    transition: color .25s ease, border-color .25s ease;
  }
  .close-btn:hover { color: var(--ink); border-color: var(--border); }

  .seal-photo {
  width: 154px;
  height: 154px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  }

  /* ---------- Accessibility floor ---------- */
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>

<script>
  // ---------- Sheets: open / close, Escape, backdrop click ----------
  function openSheet(id) {
    var el = document.getElementById(id);
    el.style.display = 'flex';
    requestAnimationFrame(function () { el.classList.add('is-open'); });
    document.addEventListener('keydown', handleEscape);
  }
  function closeSheet(id) {
    var el = document.getElementById(id);
    el.classList.remove('is-open');
    document.removeEventListener('keydown', handleEscape);
    setTimeout(function () { el.style.display = 'none'; }, 320);
  }
  function handleEscape(e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.sheet.is-open').forEach(function (el) { closeSheet(el.id); });
    }
  }
  document.querySelectorAll('.sheet').forEach(function (sheet) {
    sheet.addEventListener('click', function (e) {
      if (e.target === sheet) closeSheet(sheet.id);
    });
  });

  // ---------- Ambient embers ----------
  (function () {
    var canvas = document.getElementById('embers');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var raf = null;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function init() {
      resize();
      var count = reduceMotion ? 0 : Math.min(55, Math.floor((canvas.width * canvas.height) / 16000));
      particles = [];
      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.6 + 0.4,
          speed: Math.random() * 0.3 + 0.08,
          drift: (Math.random() - 0.5) * 0.15,
          alpha: Math.random() * 0.5 + 0.15
        });
      }
    }
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#c9a15f';
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.y -= p.speed;
        p.x += p.drift;
        if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(tick);
    }

    window.addEventListener('resize', init);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); raf = null; }
      else if (!raf && !reduceMotion) { tick(); }
    });

    init();
    if (!reduceMotion) tick();
  })();
</script>
